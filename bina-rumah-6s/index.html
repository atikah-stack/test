<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #101216; }
      #root { position: relative; width: 100%; height: 100%; background: #101216; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="build" data-composition-id="build" data-composition-src="compositions/build.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="sx-rise" class="clip" src="assets/sfx/riser.mp3" data-start="1.0" data-duration="3.4" data-track-index="3" data-volume="0.13" data-fade-out="0.5"></audio>
      <audio id="sx-k1" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.02" data-duration="0.36" data-track-index="4" data-volume="0.2"></audio>
      <audio id="sx-k2" class="clip" src="assets/sfx/click-soft.mp3" data-start="2.02" data-duration="0.36" data-track-index="5" data-volume="0.2"></audio>
      <audio id="sx-k3" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.02" data-duration="0.36" data-track-index="4" data-volume="0.2"></audio>
      <audio id="sx-done" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.5" data-duration="1.5" data-track-index="6" data-volume="0.28" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
