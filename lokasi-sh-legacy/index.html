<!doctype html>
<html lang="ms" data-resolution="portrait">

      <audio id="sx-c1" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.47" data-duration="0.36" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sx-c2" class="clip" src="assets/sfx/pop.mp3" data-start="4.12" data-duration="0.72" data-track-index="4" data-volume="0.22"></audio>
      <audio id="sx-c3" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.02" data-duration="0.36" data-track-index="5" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
