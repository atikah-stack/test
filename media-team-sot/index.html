<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-width="1080" data-height="1920">
      <!-- rumah sahaja -->
      <div id="cam1" class="cam" style="z-index: 1"><img id="h1" class="clip shot" src="assets/shots/h1.jpg" data-start="0" data-duration="1.6" data-track-index="1" alt="Luar banglo" /></div>
      <div id="cam2" class="cam" style="z-index: 2"><img id="h2" class="clip shot" src="assets/shots/h2.jpg" data-start="1.6" data-duration="1.55" data-track-index="2" alt="Ruang tamu" /></div>
      <div id="cam3" class="cam" style="z-index: 3"><img id="h3" class="clip shot" src="assets/shots/h3.jpg" data-start="3.15" data-duration="1.7" data-track-index="1" alt="Dapur" /></div>
      <div id="cam4" class="cam" style="z-index: 4"><img id="h4" class="clip shot" src="assets/shots/h4.jpg" data-start="4.85" data-duration="1.55" data-track-index="2" alt="Bilik tidur" /></div>

      <!-- SOT klien, penuh tanpa potong -->
      <audio id="sot" class="clip" src="assets/shots/sot.m4a" data-start="0" data-duration="6.4" data-track-index="8" data-volume="1"></audio>
      <audio id="pop" class="clip" src="assets/shots/pop.mp3" data-start="4.88" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>

      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html" data-start="0" data-duration="6.4" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 40"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cam1", { scale: 1.0 }, { scale: 1.08, duration: 1.6, ease: "none" }, 0);
      tl.fromTo("#cam2", { scale: 1.08, xPercent: 2 }, { scale: 1.08, xPercent: -2, duration: 1.55, ease: "none" }, 1.6);
      // comedic punch-in on "berapa"
      tl.fromTo("#cam3", { scale: 1.0 }, { scale: 1.02, duration: 0.3, ease: "none" }, 3.15);
      tl.to("#cam3", { scale: 1.16, duration: 0.18, ease: "power4.out" }, 3.46);
      tl.to("#cam3", { scale: 1.2, duration: 1.2, ease: "none" }, 3.64);
      // bounce-in on the last shot
      tl.fromTo("#cam4", { scale: 1.14 }, { scale: 1.0, duration: 0.45, ease: "back.out(2.2)" }, 4.85);
      tl.to("#cam4", { scale: 1.04, duration: 1.1, ease: "sine.inOut" }, 5.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
