<!doctype html>
<html lang="ms" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { width:100%; height:100%; background:#000; font-family:"Montserrat",sans-serif; color:#fff; }
.v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
.y { color:#f6c343; }
.hd { font-weight:800; line-height:1.02; letter-spacing:-0.01em; text-transform:uppercase; text-align:center; text-shadow:0 4px 18px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); }
#hook { position:absolute; left:40px; right:40px; top:360px; }
#hookShade { position:absolute; left:0; right:0; top:0; height:900px; background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0)); }
.sub { position:absolute; left:50px; right:50px; top:1300px; text-align:center; }
.cb { display:inline-block; padding:12px 26px 14px; border-radius:16px; background:rgba(0,0,0,.62); font-weight:700; font-size:46px; line-height:1.22; }
#outro { position:absolute; inset:0; overflow:hidden; }
#outro .bg { position:absolute; inset:0; width:1080px; height:1920px; }
.ol { position:absolute; display:block; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="145.03" data-width="1080" data-height="1920">
  <video id="vpool" class="v clip" src="assets/v/tour-stab3.mp4" muted playsinline data-start="0" data-duration="0.6" data-media-start="134.6" data-track-index="0"></video>
  <video id="vtour" class="v clip" src="assets/v/tour-stab3.mp4" muted playsinline data-start="0.6" data-duration="138.43" data-media-start="0.6" data-track-index="0"></video>
  <div id="hookShade" class="clip" data-start="0" data-duration="7.9" data-track-index="2"></div>
  <div id="hook" class="clip" data-start="0.05" data-duration="7.6" data-track-index="5">
    <div id="hk1" class="hd" style="font-size:80px">MINTA YANG<br>BESAR-BESAR…</div>
    <div id="hk2" class="hd y" style="font-size:84px;margin-top:14px">ALLAH BAGI SIAP<br>DENGAN KOLAM!</div>
  </div>
  <div id="s0" class="sub clip" data-start="0.0" data-duration="2.17" data-track-index="6"><span class="cb">Saya tidak minta yang kecil-kecil.</span></div>
<div id="s1" class="sub clip" data-start="2.2" data-duration="1.78" data-track-index="6"><span class="cb">Saya selalu minta yang <span class="y">besar-besar.</span></span></div>
<div id="s2" class="sub clip" data-start="4.0" data-duration="1.74" data-track-index="6"><span class="cb">Saya takut minta yang kecil</span></div>
<div id="s3" class="sub clip" data-start="5.76" data-duration="1.84" data-track-index="6"><span class="cb">mengkerdilkan <span class="y">Allah Yang Maha Besar.</span></span></div>
  <div id="outro" class="clip" data-start="139.03" data-duration="6.0" data-track-index="7">
    <img id="obgB" class="bg" src="assets/img/o_blur.jpg" alt="" />
    <img id="obgF" class="bg" src="assets/img/o_full.jpg" alt="" style="opacity:0" />
    <img id="o_line1" class="ol" src="assets/img/o_line1.png" style="left:400px;top:772px;width:112px;height:153px;" alt="" /><img id="o_line2" class="ol" src="assets/img/o_line2.png" style="left:718px;top:872px;width:124px;height:163px;" alt="" /><img id="o_card1" class="ol" src="assets/img/o_card1.png" style="left:140px;top:195px;width:405px;height:473px;" alt="" /><img id="o_label1" class="ol" src="assets/img/o_label1.png" style="left:118px;top:668px;width:432px;height:104px;" alt="" /><img id="o_card2" class="ol" src="assets/img/o_card2.png" style="left:650px;top:248px;width:380px;height:530px;" alt="" /><img id="o_label2" class="ol" src="assets/img/o_label2.png" style="left:662px;top:778px;width:370px;height:94px;" alt="" /><img id="o_head" class="ol" src="assets/img/o_head.png" style="left:55px;top:1165px;width:980px;height:275px;" alt="" /><img id="o_cta" class="ol" src="assets/img/o_cta.png" style="left:85px;top:1438px;width:910px;height:137px;" alt="" /><img id="o_walk" class="ol" src="assets/img/o_walk.png" style="left:85px;top:1578px;width:910px;height:77px;" alt="" />
  </div>
  <div id="flash" class="clip" data-start="138.78" data-duration="0.6" data-track-index="8"></div>
  <audio id="aud" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="145.03" data-volume="1" data-track-index="9"></audio>
  <audio id="fx0" class="clip" src="assets/audio/whoosh.mp3" data-start="0.0" data-duration="1.2" data-volume="0.25" data-track-index="10"></audio>
  <audio id="fx1" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="0.6" data-duration="1.2" data-volume="0.22" data-track-index="11"></audio>
  <audio id="fx2" class="clip" src="assets/audio/whoosh.mp3" data-start="138.73" data-duration="1.2" data-volume="0.25" data-track-index="10"></audio>
  <audio id="fx3" class="clip" src="assets/audio/pop.mp3" data-start="139.38" data-duration="0.8" data-volume="0.2" data-track-index="11"></audio>
  <audio id="fx4" class="clip" src="assets/audio/pop.mp3" data-start="139.98" data-duration="0.8" data-volume="0.2" data-track-index="12"></audio>
  <audio id="fx5" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="140.63" data-duration="1.2" data-volume="0.22" data-track-index="11"></audio>
  <audio id="fx6" class="clip" src="assets/audio/chime.mp3" data-start="141.18" data-duration="1.2" data-volume="0.18" data-track-index="12"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const T0=139.03;
// hook
tl.fromTo("#vpool",{scale:1.18},{scale:1.05,duration:0.6,ease:"power2.out"},0);
tl.fromTo("#hk1",{opacity:0,y:40,scale:0.85},{opacity:1,y:0,scale:1,duration:0.35,ease:"back.out(2)"},0.08);
tl.fromTo("#hk2",{opacity:0,y:40,scale:0.85},{opacity:1,y:0,scale:1,duration:0.35,ease:"back.out(2)"},0.55);
tl.to("#hk2",{scale:1.05,duration:0.18,yoyo:true,repeat:1,ease:"power1.inOut"},3.4);
tl.to("#hook",{opacity:0,y:-20,duration:0.35,ease:"power1.in"},7.3);
tl.to("#hookShade",{opacity:0,duration:0.5},7.3);
document.querySelectorAll(".sub").forEach(el=>{const s=parseFloat(el.dataset.start); tl.fromTo(el.querySelector(".cb"),{opacity:0,y:12},{opacity:1,y:0,duration:0.14},s);});
// transition flash into outro
tl.fromTo("#flash",{opacity:0},{opacity:0.85,duration:0.25,ease:"power2.in"},T0-0.25);
tl.to("#flash",{opacity:0,duration:0.35,ease:"power2.out"},T0);
// outro background: blurred -> sharp, slow push
tl.fromTo("#outro",{scale:1.08},{scale:1.0,duration:3.0,ease:"power2.out"},T0);
tl.to("#obgF",{opacity:1,duration:2.2,ease:"sine.inOut"},T0+0.5);
// Kelantan set
tl.fromTo("#o_card1",{opacity:0,scale:0.6,rotation:-6,transformOrigin:"50% 100%"},{opacity:1,scale:1,rotation:0,duration:0.5,ease:"back.out(1.8)"},T0+0.3);
tl.fromTo("#o_label1",{opacity:0,x:-80},{opacity:1,x:0,duration:0.35,ease:"power3.out"},T0+0.55);
tl.fromTo("#o_line1",{opacity:0,y:-30},{opacity:1,y:0,duration:0.35,ease:"bounce.out"},T0+0.7);
// Terengganu set
tl.fromTo("#o_card2",{opacity:0,scale:0.6,rotation:6,transformOrigin:"50% 100%"},{opacity:1,scale:1,rotation:0,duration:0.5,ease:"back.out(1.8)"},T0+0.9);
tl.fromTo("#o_label2",{opacity:0,x:80},{opacity:1,x:0,duration:0.35,ease:"power3.out"},T0+1.15);
tl.fromTo("#o_line2",{opacity:0,y:-30},{opacity:1,y:0,duration:0.35,ease:"bounce.out"},T0+1.3);
// headline slam + CTA
tl.fromTo("#o_head",{opacity:0,scale:1.5,filter:"blur(10px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:0.4,ease:"power3.out"},T0+1.6);
tl.fromTo("#o_cta",{opacity:0,y:60,scale:0.8},{opacity:1,y:0,scale:1,duration:0.4,ease:"back.out(2)"},T0+2.1);
tl.fromTo("#o_walk",{opacity:0,y:30},{opacity:1,y:0,duration:0.35,ease:"power2.out"},T0+2.45);
tl.to("#o_cta",{scale:1.05,duration:0.4,yoyo:true,repeat:5,ease:"sine.inOut"},T0+2.7);
window.__timelines["main"] = tl;
</script>
</body>
</html>
