<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #101216; }
      #root { position: relative; width: 100%; height: 100%; background: #101216; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="film" data-composition-id="film" data-composition-src="compositions/film.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="sx-rise" class="clip" src="assets/sfx/riser.mp3" data-start="1.15" data-duration="1.9" data-track-index="3" data-volume="0.15" data-fade-out="0.4"></audio>
      <audio id="sx-fly" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.0" data-duration="0.57" data-track-index="4" data-volume="0.22"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
