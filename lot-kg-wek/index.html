<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1210; }
      #root { position: relative; width: 100%; height: 100%; background: #0d1210; }
      .vw { position: absolute; inset: 0; z-index: 1; overflow: hidden; transform-origin: 50% 50%; }
      .vw video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.0" data-width="1080" data-height="1920">
      <div class="vw" id="w-s-hook"><video id="s-hook" class="clip" src="assets/video/drone.mp4" data-start="0.0" data-duration="4.2" data-media-start="22.1" data-playback-rate="1.0" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-top"><video id="s-top" class="clip" src="assets/video/drone.mp4" data-start="4.0" data-duration="1.9" data-media-start="5.4" data-playback-rate="1.0" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-loc"><video id="s-loc" class="clip" src="assets/video/drone.mp4" data-start="9.0" data-duration="4.2" data-media-start="10.8" data-playback-rate="0.72" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-lm1"><video id="s-lm1" class="clip" src="assets/video/drone.mp4" data-start="13.0" data-duration="4.6" data-media-start="13.8" data-playback-rate="0.9" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-lm2"><video id="s-lm2" class="clip" src="assets/video/drone.mp4" data-start="17.4" data-duration="4.8" data-media-start="7.0" data-playback-rate="0.78" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-nbh"><video id="s-nbh" class="clip" src="assets/video/drone.mp4" data-start="22.0" data-duration="4.2" data-media-start="0.6" data-playback-rate="1.0" data-track-index="1" muted playsinline></video></div>
      <div class="vw" id="w-s-cta"><video id="s-cta" class="clip" src="assets/video/drone.mp4" data-start="26.0" data-duration="4.0" data-media-start="18.0" data-playback-rate="1.0" data-track-index="1" muted playsinline></video></div>
      <div id="lay" data-composition-id="lay" data-composition-src="compositions/lay.html" data-start="5.6" data-duration="3.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="gfx" data-composition-id="gfx" data-composition-src="compositions/gfx.html" data-start="0" data-duration="30.0" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <audio id="sx-hook" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0.32" data-duration="2.5" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sx-hook2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.95" data-duration="0.57" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sx-t1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.85" data-duration="0.57" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sx-lay" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="5.45" data-duration="1.6" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sx-head2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="5.9" data-duration="2.0" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sx-lot0" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.55" data-duration="0.36" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sx-lot1" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.87" data-duration="0.36" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sx-lot2" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.19" data-duration="0.36" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sx-lot3" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.51" data-duration="0.36" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sx-lot4" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.83" data-duration="0.36" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sx-lot5" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.15" data-duration="0.36" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sx-t2" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.85" data-duration="0.57" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sx-pin" class="clip" src="assets/sfx/notification.mp3" data-start="9.6" data-duration="1.2" data-track-index="5" data-volume="0.25"></audio>
      <audio id="sx-card0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.0" data-duration="0.57" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sx-pop0" class="clip" src="assets/sfx/pop.mp3" data-start="13.4" data-duration="0.72" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sx-card1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.5" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="16.9" data-duration="0.72" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sx-card2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.5" data-duration="0.57" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="19.9" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sx-t4" class="clip" src="assets/sfx/whoosh.mp3" data-start="21.85" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sx-nbh" class="clip" src="assets/sfx/sparkle.mp3" data-start="22.45" data-duration="1.4" data-track-index="7" data-volume="0.22"></audio>
      <audio id="sx-rise" class="clip" src="assets/sfx/riser.mp3" data-start="24.6" data-duration="1.5" data-track-index="5" data-volume="0.28"></audio>
      <audio id="sx-cta" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="26.15" data-duration="2.0" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sx-wa" class="clip" src="assets/sfx/notification.mp3" data-start="27.35" data-duration="1.2" data-track-index="7" data-volume="0.3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // slow cinematic push in every shot; a short scale settle on entry so cuts feel like camera moves
      [["s-hook", 0.0, 4.2], ["s-top", 4.0, 1.9], ["s-loc", 9.0, 4.2], ["s-lm1", 13.0, 4.6], ["s-lm2", 17.4, 4.8], ["s-nbh", 22.0, 4.2], ["s-cta", 26.0, 4.0]].forEach(([id, s, d], i) => {
        tl.fromTo("#w-" + id, { scale: 1.12 }, { scale: 1.03, duration: 0.6, ease: "expo.out" }, s);
        tl.to("#w-" + id, { scale: i === 0 || i === 6 ? 1.13 : 1.09, duration: d - 0.6, ease: "none" }, s + 0.6);
      });
      tl.to("#w-s-cta", { opacity: 0, duration: 0.6, ease: "power1.in" }, 29.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
