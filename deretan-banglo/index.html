<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #10151D; }
      #root { position: relative; width: 100%; height: 100%; background: #10151D; }
      #w-tal { position: absolute; inset: 0; z-index: 1; overflow: hidden; transform-origin: 50% 45%; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .bw { position: absolute; inset: 0; z-index: 2; overflow: hidden; }
      #shade { position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: linear-gradient(180deg, rgba(12,18,28,.5) 0%, rgba(12,18,28,.32) 30%, rgba(12,18,28,0) 46%, rgba(12,18,28,0) 64%, rgba(12,18,28,.38) 80%, rgba(12,18,28,.45) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.15" data-width="1080" data-height="1920">
      <div id="w-tal">
      <video id="v-tal" class="clip full" src="assets/video/talent.mp4" data-start="0" data-duration="33.15" data-media-start="0" data-track-index="1" playsinline data-has-audio="true" data-volume="1"></video>
      </div>
      <div id="b-row1-w" class="bw"><video id="b-row1" class="clip full" src="assets/video/aerial-BB0FB1E8.mp4" data-start="2.6" data-duration="2.6" data-media-start="0.6" data-track-index="2" muted playsinline></video></div>
      <div id="b-row2-w" class="bw"><video id="b-row2" class="clip full" src="assets/video/aerial-5899E7BB.mp4" data-start="5.2" data-duration="2.75" data-media-start="0.5" data-track-index="2" muted playsinline></video></div>
      <div id="b-land-w" class="bw"><video id="b-land" class="clip full" src="assets/video/drone-0169.mp4" data-start="12.4" data-duration="5.0" data-media-start="0.5" data-track-index="2" muted playsinline></video></div>
      <div id="b-area-w" class="bw"><video id="b-area" class="clip full" src="assets/video/aerial-C51AA0CC.mp4" data-start="17.4" data-duration="1.9" data-media-start="2.0" data-track-index="2" muted playsinline></video></div>
      <div id="b-map-w" class="bw clip" data-start="19.3" data-duration="4.32" data-track-index="2"><img id="b-map" class="full" src="assets/img/lot-map.jpg" alt="" /></div>
      <div id="b-wide-w" class="bw"><video id="b-wide" class="clip full" src="assets/video/aerial-D9D2F1E2.mp4" data-start="23.62" data-duration="3.33" data-media-start="0.0" data-track-index="2" muted playsinline></video></div>
      <div id="shade"></div>
      <div id="gfx" data-composition-id="gfx" data-composition-src="compositions/gfx.html" data-start="0" data-duration="33.15" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <audio id="bgm" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="33.15" data-track-index="4" data-volume="0.09" data-fade-out="1.2"></audio>
      <audio id="sx-row1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.58" data-duration="0.57" data-track-index="6" data-volume="0.15"></audio>
      <audio id="sx-hd1" class="clip" src="assets/sfx/pop.mp3" data-start="2.75" data-duration="0.72" data-track-index="7" data-volume="0.14"></audio>
      <audio id="sx-row2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.18" data-duration="0.57" data-track-index="5" data-volume="0.13"></audio>
      <audio id="sx-lot" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.93" data-duration="0.57" data-track-index="6" data-volume="0.16"></audio>
      <audio id="sx-lotimp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="8.43" data-duration="1.6" data-track-index="7" data-volume="0.16"></audio>
      <audio id="sx-land" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.38" data-duration="0.57" data-track-index="5" data-volume="0.13"></audio>
      <audio id="sx-n7244" class="clip" src="assets/sfx/ping.mp3" data-start="14.85" data-duration="1.0" data-track-index="6" data-volume="0.12"></audio>
      <audio id="sx-area" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.38" data-duration="0.57" data-track-index="7" data-volume="0.13"></audio>
      <audio id="sx-strat" class="clip" src="assets/sfx/pop.mp3" data-start="17.5" data-duration="0.72" data-track-index="5" data-volume="0.14"></audio>
      <audio id="sx-masjid" class="clip" src="assets/sfx/pop.mp3" data-start="19.45" data-duration="0.72" data-track-index="6" data-volume="0.15"></audio>
      <audio id="sx-klinik" class="clip" src="assets/sfx/pop.mp3" data-start="20.65" data-duration="0.72" data-track-index="7" data-volume="0.15"></audio>
      <audio id="sx-bandar" class="clip" src="assets/sfx/pop.mp3" data-start="21.69" data-duration="0.72" data-track-index="5" data-volume="0.15"></audio>
      <audio id="sx-wide" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="23.6" data-duration="0.57" data-track-index="6" data-volume="0.12"></audio>
      <audio id="sx-n1400" class="clip" src="assets/sfx/ping.mp3" data-start="25.92" data-duration="1.0" data-track-index="7" data-volume="0.12"></audio>
      <audio id="sx-cta" class="clip" src="assets/sfx/whoosh.mp3" data-start="28.75" data-duration="0.57" data-track-index="5" data-volume="0.15"></audio>
      <audio id="sx-cta2" class="clip" src="assets/sfx/pop.mp3" data-start="31.32" data-duration="0.72" data-track-index="6" data-volume="0.15"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      [["b-row1", 2.6, 5.2], ["b-row2", 5.2, 7.95], ["b-land", 12.4, 17.4], ["b-area", 17.4, 19.3], ["b-map", 19.3, 23.62], ["b-wide", 23.62, 26.95]].forEach(([id, s, e]) => {
        tl.fromTo("#" + id + "-w", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, s);
        tl.fromTo("#" + id, { scale: 1.0 }, { scale: 1.08, duration: e - s, ease: "none" }, s);
      });
      // presenter is framed wide: open on a punch-in, slow push through, closer push on the CTA
      tl.fromTo("#w-tal", { scale: 1.25 }, { scale: 1.12, duration: 2.6, ease: "power2.out" }, 0);
      tl.fromTo("#w-tal", { scale: 1.12 }, { scale: 1.3, duration: 6.2, ease: "sine.inOut", immediateRender: false }, 26.95);
      tl.to("#root", { opacity: 0, duration: 0.4 }, 32.75);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
