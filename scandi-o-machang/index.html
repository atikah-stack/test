      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Sideways source: a portrait box turned a quarter-turn left fills the frame upright. */
      .turn { position: absolute; left: -420px; top: -747px; width: 1920px; height: 3414px; transform: rotate(-90deg); }
      .rot { position: absolute; left: 0; top: 0; width: 1920px; height: 3414px; object-fit: cover; }

    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      const shots = [["s01", 0.0, 5.0, 1.0, 1.06, false, false], ["s02", 5.0, 3.3, 1.0, 1.03, true, false], ["s03", 8.3, 2.7, 1.0, 1.03, false, false], ["s04", 11.0, 3.2, 1.0, 1.04, false, false], ["s05", 14.2, 2.2, 1.0, 1.04, false, false], ["s06", 16.4, 1.6, 1.03, 1.06, false, false], ["s07", 18.0, 1.4, 1.0, 1.04, false, false], ["s08", 19.4, 1.6, 1.0, 1.04, false, false], ["s09", 21.0, 2.2, 1.0, 1.04, false, false], ["s10", 23.2, 1.8, 1.0, 1.04, false, false], ["s11", 25.0, 1.8, 1.0, 1.04, false, false], ["s12", 26.8, 1.2, 1.0, 1.04, false, false], ["s13", 28.0, 1.8, 1.0, 1.04, false, false], ["s14", 29.8, 2.2, 1.0, 1.07, false, false], ["s15", 32.0, 2.0, 1.0, 1.04, false, false], ["s16", 34.0, 5.0, 1.0, 1.06, true, false], ["s17", 39.0, 3.5, 1.0, 1.03, true, false]];
      shots.forEach(([id, s, d, z0, z1, dissolve, rotated]) => {
        if (rotated) {
          // local y is screen x after the quarter turn: drift slowly across the facade
          tl.fromTo("#" + id, { y: 160, scale: z0 }, { y: -160, scale: z1, duration: d, ease: "none" }, s);
        } else {
          tl.fromTo("#" + id, { scale: z0 }, { scale: z1, duration: d, ease: "none" }, s);
        }
        if (dissolve) tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, s);
      });
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.in" }, 41.7);
      window.__timelines["main"] = tl;
    </script>
