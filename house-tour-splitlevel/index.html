<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.05" data-width="1080" data-height="1920">
      <!-- hook: "Banglo berkonsepkan split level, besar kan?" -->
      <div id="cam-a" class="cam" style="z-index: 1"><video id="v-a" class="clip shot" src="assets/shots/a_hook.mp4" data-start="0" data-duration="3.35" data-media-start="0" data-track-index="1" data-has-audio="true" data-volume="1" playsinline></video></div>
      <!-- "Pernah tak tuan-puan…" -->
      <div id="cam-b" class="cam" style="z-index: 2"><video id="v-b" class="clip shot" src="assets/shots/b_intro.mp4" data-start="3.35" data-duration="9.45" data-media-start="0" data-track-index="2" data-has-audio="true" data-volume="1" playsinline></video></div>
      <!-- saiz & bilik -->
      <div id="cam-c" class="cam" style="z-index: 3"><video id="v-c" class="clip shot" src="assets/shots/c_specs.mp4" data-start="12.8" data-duration="8.85" data-media-start="0" data-track-index="1" data-has-audio="true" data-volume="1" playsinline></video></div>
      <!-- "Hari ini… Jom!" -->
      <div id="cam-d" class="cam" style="z-index: 4"><video id="v-d" class="clip shot" src="assets/shots/d_jom.mp4" data-start="21.65" data-duration="6.4" data-media-start="0" data-track-index="2" data-has-audio="true" data-volume="1" playsinline></video></div>

      <div id="copy" data-composition-id="copy" data-composition-src="compositions/copy.html" data-start="0" data-duration="28.05" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 40"></div>
      <div id="subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="28.05" data-track-index="6" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 41"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cam-a", { scale: 1.0 }, { scale: 1.08, duration: 3.35, ease: "sine.out" }, 0);
      tl.fromTo("#cam-b", { scale: 1.06 }, { scale: 1.0, duration: 9.45, ease: "sine.inOut" }, 3.35);
      tl.fromTo("#cam-c", { scale: 1.0 }, { scale: 1.07, duration: 8.85, ease: "none" }, 12.8);
      tl.fromTo("#cam-d", { scale: 1.08 }, { scale: 1.0, duration: 6.4, ease: "sine.out" }, 21.65);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
