<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.8" data-width="1080" data-height="1920">
      <!-- footage asal penuh, susunan asal -->
      <div id="cam" class="cam" style="z-index: 1"><video id="v-full" class="clip shot" src="assets/shots/full.mp4" data-start="0" data-duration="28.8" data-media-start="0" data-track-index="1" data-has-audio="true" data-volume="1" playsinline></video></div>

      <!-- bunyi pop / whoosh (Pixabay, bebas lesen) -->
      <audio id="sfx-whoosh" class="clip" src="assets/shots/whoosh-short.mp3" data-start="0.15" data-duration="0.57" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/shots/pop.mp3" data-start="13.76" data-duration="0.72" data-track-index="9" data-volume="0.4"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/shots/pop.mp3" data-start="17.62" data-duration="0.72" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/shots/pop.mp3" data-start="18.84" data-duration="0.72" data-track-index="9" data-volume="0.4"></audio>
      <audio id="sfx-pop4" class="clip" src="assets/shots/pop.mp3" data-start="19.96" data-duration="0.72" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-pop5" class="clip" src="assets/shots/pop.mp3" data-start="27.7" data-duration="0.72" data-track-index="9" data-volume="0.45"></audio>

      <div id="copy" data-composition-id="copy" data-composition-src="compositions/copy.html" data-start="0" data-duration="28.8" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 40"></div>
      <div id="subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="28.8" data-track-index="6" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 41"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // very gentle zooms only (max 1.04) to keep the picture sharp
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.03, duration: 9.55, ease: "none" }, 0);
      tl.to("#cam", { scale: 1.04, duration: 0.5, ease: "power2.out" }, 9.6);
      tl.to("#cam", { scale: 1.0, duration: 0.9, ease: "sine.inOut" }, 12.4);
      tl.to("#cam", { scale: 1.03, duration: 8.5, ease: "none" }, 13.3);
      tl.to("#cam", { scale: 1.0, duration: 6.9, ease: "sine.inOut" }, 21.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
