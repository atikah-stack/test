    <script>
      const tl = gsap.timeline({ paused: true });
      const shots = [["#s01", 0.0, 4.8], ["#s02", 4.6, 2.6], ["#s03", 7.0, 2.2], ["#s04", 9.0, 2.6], ["#s05", 11.4, 2.8], ["#s06", 14.0, 2.4], ["#s07", 16.2, 3.1], ["#s08", 19.1, 3.6], ["#s09", 22.5, 3.6], ["#s10", 25.9, 2.7], ["#s11", 28.4, 3.2], ["#s12", 31.4, 4.2], ["#s13", 35.4, 3.2], ["#s14", 38.4, 3.0], ["#s15", 41.2, 2.8], ["#s16", 43.8, 3.6], ["#s17", 47.2, 3.55]];
      shots.forEach(([sel, s, d]) => {
        if (sel === "#s07") return;
        tl.fromTo(sel, { scale: 1 }, { scale: 1.05, duration: d, ease: "none" }, s);
        if (s > 0) tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.inOut" }, s);
      });
      // Exterior: slow pan across the facade (local y is screen x after the turn).
      tl.fromTo("#s07", { y: 520, opacity: 0 }, { y: -420, duration: 3.1, ease: "sine.inOut" }, 16.2);
      tl.to("#s07", { opacity: 1, duration: 0.2, ease: "sine.inOut" }, 16.2);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.in" }, 50.15);
