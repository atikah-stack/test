<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:normal; src:url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:italic; src:url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
      @font-face { font-family:"Cormorant Garamond"; font-weight:600; font-style:normal; src:url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
      #root { width:100%; height:100%; background:#000; font-family:"Cormorant Garamond", serif; color:#f4efe6; }
      .v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
      .vig { position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
                   linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,.45) 100%); }
      .t { position:absolute; left:80px; right:80px; text-align:center; text-shadow:0 2px 28px rgba(0,0,0,.7), 0 0 10px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.5); }
      .cap { font-size:84px; font-weight:500; letter-spacing:0.14em; line-height:1.05; text-transform:uppercase; }
      .sub { font-family:"Montserrat", sans-serif; font-size:28px; font-weight:500; letter-spacing:0.62em; text-transform:uppercase; margin-top:26px; opacity:.9; }
      .rule { width:160px; height:2px; margin:30px auto 0; background:linear-gradient(90deg, rgba(212,180,120,0), #d4b478, rgba(212,180,120,0)); }
      .ital { font-size:96px; font-style:italic; font-weight:500; letter-spacing:0.02em; line-height:1.05; }
      .blk { position:absolute; inset:0; background:#000; }
      #logo { position:absolute; left:50%; top:1300px; width:300px; margin-left:-150px; filter:drop-shadow(0 0 22px rgba(255,255,255,.55)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.8" data-width="1080" data-height="1920">
      <video id="v1" class="v clip" src="assets/v/s1-estab.mp4" muted playsinline data-start="0" data-duration="4.5" data-track-index="0"></video>
      <video id="v2" class="v clip" src="assets/v/s2-facade.mp4" muted playsinline data-start="4.5" data-duration="2.5" data-track-index="0"></video>
      <video id="v3" class="v clip" src="assets/v/s3-chandelier.mp4" muted playsinline data-start="7" data-duration="3" data-track-index="0"></video>
      <video id="v4" class="v clip" src="assets/v/s4-lounge.mp4" muted playsinline data-start="10" data-duration="2" data-track-index="0"></video>
      <video id="v5" class="v clip" src="assets/v/s5-dining.mp4" muted playsinline data-start="12" data-duration="3" data-track-index="0"></video>
      <video id="v6" class="v clip" src="assets/v/s6-kitchen.mp4" muted playsinline data-start="15" data-duration="2" data-track-index="0"></video>
      <video id="v7" class="v clip" src="assets/v/s7-master.mp4" muted playsinline data-start="17" data-duration="2" data-track-index="0"></video>
      <video id="v8" class="v clip" src="assets/v/s8-bedroom.mp4" muted playsinline data-start="19" data-duration="2" data-track-index="0"></video>
      <video id="v9" class="v clip" src="assets/v/s9-stairs.mp4" muted playsinline data-start="21" data-duration="2" data-track-index="0"></video>
      <video id="v10" class="v clip" src="assets/v/s10-dusk.mp4" muted playsinline data-start="23" data-duration="7" data-track-index="0"></video>
      <video id="v10n" class="v clip" src="assets/v/s10-dusk-night.mp4" muted playsinline data-start="23" data-duration="7" data-track-index="1" style="opacity:0"></video>
      <video id="v11" class="v clip" src="assets/v/s11-final-night.mp4" muted playsinline data-start="30" data-duration="5.8" data-track-index="0"></video>

      <div id="vig" class="vig clip" data-start="0" data-duration="35.8" data-track-index="2"></div>

      <div id="t1" class="t clip" data-start="0.9" data-duration="3.5" data-track-index="3" style="top:1250px">
        <div id="t1a" class="cap">Kuala<br>Terengganu</div>
        <div id="t1r" class="rule"></div>
        <div id="t1b" class="sub">Terengganu</div>
      </div>
      <div id="t2" class="t clip" data-start="7.35" data-duration="2.55" data-track-index="3" style="top:1180px">
        <div class="ital">Crystal chandelier</div>
      </div>
      <div id="t3" class="t clip" data-start="12.35" data-duration="2.55" data-track-index="3" style="top:1180px">
        <div class="ital">Open dining</div>
      </div>
      <div id="t4" class="t clip" data-start="24.4" data-duration="5.4" data-track-index="3" style="top:560px">
        <div class="ital">Day to night</div>
      </div>
      <div id="t5" class="t clip" data-start="30.7" data-duration="5.1" data-track-index="3" style="top:560px">
        <div id="t5a" class="cap" style="font-size:96px">Your next<br>home</div>
        <div id="t5r" class="rule"></div>
      </div>
      <img id="logo" class="clip" src="assets/brand/logo-mi.png" data-start="32.6" data-duration="3.2" data-track-index="4" alt="" />

      <div id="blk" class="blk clip" data-start="0" data-duration="35.8" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // slow cinematic push-ins per shot
      const shots = [["#v1",0,4.5],["#v2",4.5,2.5],["#v3",7,3],["#v4",10,2],["#v5",12,3],["#v6",15,2],["#v7",17,2],["#v8",19,2],["#v9",21,2],["#v11",30,5.8]];
      shots.forEach(([id,s,d]) => tl.fromTo(id, { scale:1.0 }, { scale:1.06, duration:d, ease:"none" }, s));
      tl.fromTo(["#v10","#v10n"], { scale:1.0 }, { scale:1.05, duration:7, ease:"none" }, 23);

      // black: fade in, dips before interiors and before dusk, fade out
      tl.set("#blk", { opacity:1 }, 0);
      tl.to("#blk", { opacity:0, duration:1.0, ease:"power2.out" }, 0);
      tl.to("#blk", { opacity:1, duration:0.25, ease:"power1.in" }, 6.75);
      tl.to("#blk", { opacity:0, duration:0.45, ease:"power1.out" }, 7.0);
      tl.to("#blk", { opacity:1, duration:0.3, ease:"power1.in" }, 22.7);
      tl.to("#blk", { opacity:0, duration:0.7, ease:"power1.out" }, 23.0);
      tl.to("#blk", { opacity:1, duration:0.8, ease:"power1.in" }, 35.0);

      // day -> night
      tl.set("#v10n", { opacity:0 }, 23);
      tl.to("#v10n", { opacity:1, duration:4.2, ease:"sine.inOut" }, 24.2);

      // titles: soft blur-fade
      const reveal = (sel, at, hold) => {
        tl.fromTo(sel, { opacity:0, y:18, filter:"blur(10px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:1.0, ease:"power2.out" }, at);
        tl.to(sel, { opacity:0, filter:"blur(8px)", duration:0.6, ease:"power1.in" }, at + hold);
      };
      reveal("#t1a", 0.9, 2.9);
      tl.fromTo("#t1r", { opacity:0, scaleX:0 }, { opacity:1, scaleX:1, duration:0.9, ease:"power2.out" }, 1.4);
      tl.to("#t1r", { opacity:0, duration:0.5 }, 3.8);
      reveal("#t1b", 1.7, 2.1);
      reveal("#t2", 7.35, 1.95);
      reveal("#t3", 12.35, 1.95);
      reveal("#t4", 24.4, 4.6);
      tl.fromTo("#t5a", { opacity:0, y:18, filter:"blur(10px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:1.2, ease:"power2.out" }, 30.7);
      tl.fromTo("#t5r", { opacity:0, scaleX:0 }, { opacity:1, scaleX:1, duration:1.0, ease:"power2.out" }, 31.3);
      tl.fromTo("#logo", { opacity:0, y:14 }, { opacity:1, y:0, duration:1.0, ease:"power2.out" }, 32.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
