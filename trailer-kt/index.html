<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:normal; src:url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:italic; src:url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
      @font-face { font-family:"Cormorant Garamond"; font-weight:600; font-style:normal; src:url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
      #root { width:100%; height:100%; background:#000; font-family:"Cormorant Garamond", serif; color:#f4efe6; }
      .v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
      .vig { position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
                   linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,.45) 100%); }
      .t { position:absolute; left:80px; right:80px; text-align:center; text-shadow:0 2px 28px rgba(0,0,0,.7), 0 0 10px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.5); }
      .cap { font-size:84px; font-weight:500; letter-spacing:0.14em; line-height:1.05; text-transform:uppercase; }
      .sub { font-family:"Montserrat", sans-serif; font-size:28px; font-weight:500; letter-spacing:0.62em; text-transform:uppercase; margin-top:26px; opacity:.9; }
      .rule { width:160px; height:2px; margin:30px auto 0; background:linear-gradient(90deg, rgba(212,180,120,0), #d4b478, rgba(212,180,120,0)); }
      .ital { font-size:96px; font-style:italic; font-weight:500; letter-spacing:0.02em; line-height:1.05; }
      .blk { position:absolute; inset:0; background:#000; }
      #logo { position:absolute; left:50%; top:1300px; width:300px; margin-left:-150px; filter:drop-shadow(0 0 22px rgba(255,255,255,.55)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.94" data-width="1080" data-height="1920">

      <video id="vb" class="v clip" src="assets/v/baked-whip.mp4" muted playsinline data-start="0" data-duration="24.94" data-track-index="0"></video>
      <div id="vig" class="vig clip" data-start="0" data-duration="24.94" data-track-index="2"></div>

      <div id="t1" class="t clip" data-start="0.5" data-duration="2.87" data-track-index="3" style="top:1250px">
        <div id="t1a" class="cap">Kuala<br>Terengganu</div>
        <div id="t1r" class="rule"></div>
        <div id="t1b" class="sub">Terengganu</div>
      </div>
      <div id="t2" class="t clip" data-start="5.85" data-duration="2.25" data-track-index="3" style="top:1180px">
        <div class="ital">Crystal chandelier</div>
      </div>
      <div id="t3" class="t clip" data-start="9.8" data-duration="2.24" data-track-index="3" style="top:1180px">
        <div class="ital">Open dining</div>
      </div>
      <div id="t4" class="t clip" data-start="17.7" data-duration="3.81" data-track-index="3" style="top:560px">
        <div class="ital">Day to night</div>
      </div>
      <div id="t5" class="t clip" data-start="21.6" data-duration="3.34" data-track-index="3" style="top:560px">
        <div id="t5a" class="cap" style="font-size:96px">Your next<br>home</div>
        <div id="t5r" class="rule"></div>
      </div>
      <img id="logo" class="clip" src="assets/brand/logo-mi.png" data-start="22.4" data-duration="2.54" data-track-index="4" alt="" />

      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="24.94" data-volume="1" data-track-index="6"></audio>
      <div id="blk" class="blk clip" data-start="0" data-duration="24.94" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#blk", { opacity:1 }, 0);
      tl.to("#blk", { opacity:0, duration:0.7, ease:"power2.out" }, 0);
      tl.to("#blk", { opacity:1, duration:0.8, ease:"power1.in" }, 24.14);

      const reveal = (sel, at, hold) => {
        tl.fromTo(sel, { opacity:0, y:18, filter:"blur(10px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:0.9, ease:"power2.out" }, at);
        tl.to(sel, { opacity:0, filter:"blur(8px)", duration:0.45, ease:"power1.in" }, at + hold);
      };
      reveal("#t1a", 0.5, 2.4);
      tl.fromTo("#t1r", { opacity:0, scaleX:0 }, { opacity:1, scaleX:1, duration:0.8, ease:"power2.out" }, 0.9);
      tl.to("#t1r", { opacity:0, duration:0.4 }, 2.9);
      reveal("#t1b", 1.1, 1.8);
      reveal("#t2", 5.85, 1.8);
      reveal("#t3", 9.8, 1.8);
      reveal("#t4", 17.7, 3.3);
      tl.fromTo("#t5a", { opacity:0, y:18, filter:"blur(10px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:1.0, ease:"power2.out" }, 21.6);
      tl.fromTo("#t5r", { opacity:0, scaleX:0 }, { opacity:1, scaleX:1, duration:0.9, ease:"power2.out" }, 22.0);
      tl.fromTo("#logo", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.9, ease:"power2.out" }, 22.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
