<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"line1","type":"string","label":"Title line 1 (white)","default":"ENGLISH STYLE BUNGALOW"},
    {"id":"line2","type":"string","label":"Title line 2 (gold)","default":"2,785 SQ FT"},
    {"id":"brand","type":"string","label":"Brand","default":"MAHLIGAI IDAMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d0f12; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div
        id="tour"
        data-composition-id="tour"
        data-composition-src="compositions/tour.html"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="intro-title"
        data-composition-id="intro-title"
        data-composition-src="compositions/intro-title.html"
        data-start="0"
        data-duration="3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="end-title"
        data-composition-id="end-title"
        data-composition-src="compositions/end-title.html"
        data-start="27"
        data-duration="3"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
