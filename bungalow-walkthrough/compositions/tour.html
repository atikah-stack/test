    .shot { position: absolute; inset: 0; overflow: hidden; }
    /* Each image is laid out in its 1920x1080 source space; the camera moves the .cam wrapper. */
    .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .cam img { display: block; width: 1920px; height: 1080px; }
    /* Wide framed shots melt into the backdrop at top and bottom instead of showing a hard edge. */
    .feather img {

  <script>
    (function () {
      const W = 1080, H = 1920, IW = 1920, IH = 1080;
      // Camera = the image point (cx, cy) held at screen centre, at scale s.
      // Full-bleed shots clamp the point so the image always covers the frame.
      function cam(cx, cy, s, cover) {
        if (cover) {
          const hx = W / 2 / s, hy = H / 2 / s;
          cx = Math.min(Math.max(cx, hx), IW - hx);
          cy = Math.min(Math.max(cy, hy), IH - hy);
        }
        return { x: W / 2 - cx * s, y: H / 2 - cy * s, scale: s };
      }
      const DISSOLVE = 0.7;
      // [shot, start, duration, from, to, ease, cover]
      const shots = [
        ["a", 0.0, 5.6, [960, 545, 0.575], [815, 470, 1.35], "power2.in", false],
        ["b", 4.6, 3.8, [725, 540, 1.8], [1430, 540, 1.82], "sine.inOut", true],
        ["c", 7.4, 3.4, [1230, 560, 1.8], [1480, 560, 1.9], "sine.inOut", true],
        ["d", 9.9, 3.4, [880, 520, 1.85], [905, 600, 2.12], "sine.inOut", true],
        ["e", 12.4, 3.2, [815, 560, 2.05], [815, 610, 2.28], "sine.inOut", true],
        ["f", 14.7, 4.9, [520, 640, 2.1], [1000, 520, 1.82], "sine.inOut", true],
        ["g", 18.6, 5.0, [780, 520, 1.82], [1330, 540, 1.86], "sine.inOut", true],
        ["h", 22.6, 5.6, [880, 545, 2.05], [960, 545, 0.575], "power2.inOut", false],
      ];
      const tl = gsap.timeline({ paused: true });
      shots.forEach(([id, start, dur, from, to, ease, cover], i) => {
        tl.fromTo("#cam-" + id, cam(...from, cover), { ...cam(...to, cover), duration: dur, ease: ease }, start);
        if (i > 0) {
          tl.fromTo("#shot-" + id, { opacity: 0 }, { opacity: 1, duration: DISSOLVE, ease: "sine.inOut" }, start);
        }
      });
      window.__timelines["tour"] = tl;
    })();
  </script>
