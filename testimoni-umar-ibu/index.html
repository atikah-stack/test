    <script>
      const tl = gsap.timeline({ paused: true });
      const shots = [["#s01",0,3.45],["#s02",3.25,3.5],["#s03",6.55,2.6],["#s04",8.95,3.3],["#s05",12.05,2.9],["#s06",14.75,3.2],["#s07",17.75,3.2],["#s08",20.75,3.4],["#s09",23.95,5.4],["#s10",29.15,3],["#s11",31.95,2.4],["#s12",34.15,2.6],["#s13",36.55,2.3],["#s14",38.65,3],["#s15",41.45,3.4],["#s16",44.65,2.6],["#s17",47.05,3.2],["#s18",50.05,1.95]];
      shots.forEach(([sel, s, d]) => {
        tl.fromTo(sel, { scale: 1 }, { scale: s === 0 ? 1.015 : 1.05, duration: d, ease: "none" }, s);
        if (s > 0) tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "sine.inOut" }, s);
      });
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.in" }, 51.15);
      window.__timelines["main"] = tl;
    </script>
